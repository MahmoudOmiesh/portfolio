pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      exclude:
        - "src/components/ui/**"
        - "src/routeTree.gen.ts"
        - "tools/**"
      run: bun oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      run: bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
